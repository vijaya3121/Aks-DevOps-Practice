name: Deploy to AKS using Helm

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: latest

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: latest

    - name: Set kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    - name: Deploy using Helm
      run: |
        helm upgrade --install nodejs-app ./nodejs-app-chart \
          --namespace dev \
          --create-namespace
